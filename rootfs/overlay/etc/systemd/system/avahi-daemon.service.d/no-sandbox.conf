# Disable user/mount-namespace sandboxing for avahi-daemon.
#
# Why: the sm8150 mainline kernel rejects some namespace operations that
# avahi's default unit relies on (RestrictNamespaces=yes + ProtectSystem=full
# + ProtectHome=yes + ProtectKernelTunables=yes). Without this drop-in,
# avahi-daemon fails with status=226/NAMESPACE on first boot, mDNS never
# comes up, and "nabu-cachyos.local" stays unresolvable.
#
# Same family of bug as the dbus-broker → dbus-daemon swap already applied
# in build-rootfs.sh — both rely on namespace primitives this kernel
# doesn't fully support. CONFIG_USER_NS=y is set; this is about specific
# operations (likely mount-namespace bind-mounts inside the sandbox).
#
# Discovered during NAS-226 first-boot validation on the 6.17-wifi-fix
# kernel; same symptom on earlier kernels per upstream pmOS port.
[Service]
ProtectSystem=no
ProtectHome=no
ProtectKernelTunables=no
RestrictNamespaces=no
PrivateUsers=no
NoNewPrivileges=no
