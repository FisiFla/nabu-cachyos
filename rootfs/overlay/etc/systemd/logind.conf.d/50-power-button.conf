# Tablet power-button behaviour.
#
# What we'd want: short press = suspend (iPad/Android UX). What works on
# this kernel: nothing reliable. The msm_mdss display IRQ fires within
# ~1 s of s2idle entry and wakes the system back up before anything else
# finishes suspending. Without a kernel patch to mask DRM IRQs during
# s2idle (or proper deep-suspend support which sm8150 mainline doesn't
# expose — only [s2idle] in /sys/power/mem_sleep) we can't deliver a real
# suspend.
#
# So map short-press to `ignore`: nothing happens. Better than the prior
# `poweroff` default (every accidental press shut the tablet down) and
# better than `suspend` (the screen blinked off then on, looking broken)
# and better than `lock` (the build ships passwordless — a lock screen
# would be un-unlockable without setting a password first).
#
# The user can still trigger suspend explicitly via the GNOME top-right
# menu if they want to experiment, and long-press still powers off.
#
# See README §Known Limitations for the s2idle quiesce issue.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
HandleSuspendKey=ignore

# nabu has no lid switch — these handlers fire on phantom HALL_SENSOR
# events at boot on some kernels. Ignore them so the device never
# accidentally suspends from a non-existent lid.
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
