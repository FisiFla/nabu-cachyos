<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Circle Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Flashlight Body Metallic Gradient -->
    <linearGradient id="bodyMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="35%" stop-color="#334155"/>
      <stop offset="70%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Head / Reflector Gradient -->
    <linearGradient id="headMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="40%" stop-color="#475569"/>
      <stop offset="80%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Golden Beam Glow -->
    <radialGradient id="lensGlow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#facc15"/>
      <stop offset="90%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </radialGradient>

    <!-- Light Rays / Cone Gradient -->
    <linearGradient id="beamCone" x1="20%" y1="20%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#facc15" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fde047" stop-opacity="0"/>
    </linearGradient>

    <!-- Power Switch Accent -->
    <linearGradient id="switchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="torchShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base Glow -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGlow)"/>

  <!-- Radiating Light Cone from Head -->
  <path d="M 44 38 L 10 6 L 6 10 L 38 44 Z" fill="url(#beamCone)" />
  <path d="M 48 34 L 14 2 L 2 14 L 34 48 Z" fill="url(#beamCone)" opacity="0.6"/>

  <!-- Flashlight Assembly tilted 45 degrees -->
  <g filter="url(#torchShadow)">
    <!-- Main Body Tube -->
    <rect x="52" y="58" width="24" height="46" rx="6"
          transform="rotate(-45 64 81)"
          fill="url(#bodyMetal)" stroke="#64748b" stroke-width="1.5"/>

    <!-- Grip Ribs -->
    <rect x="55" y="64" width="18" height="3" rx="1.5" transform="rotate(-45 64 81)" fill="#1e293b"/>
    <rect x="55" y="70" width="18" height="3" rx="1.5" transform="rotate(-45 64 81)" fill="#1e293b"/>
    <rect x="55" y="76" width="18" height="3" rx="1.5" transform="rotate(-45 64 81)" fill="#1e293b"/>
    <rect x="55" y="82" width="18" height="3" rx="1.5" transform="rotate(-45 64 81)" fill="#1e293b"/>

    <!-- Tail Cap -->
    <rect x="50" y="98" width="28" height="9" rx="3"
          transform="rotate(-45 64 81)"
          fill="#1e293b" stroke="#475569" stroke-width="1.5"/>

    <!-- Head / Reflector Bell -->
    <path d="M 44 48 L 54 38 L 76 60 L 66 70 Z"
          fill="url(#headMetal)" stroke="#64748b" stroke-width="1.5"/>
    <path d="M 38 42 L 50 30 L 68 48 L 56 60 Z"
          fill="url(#headMetal)" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Lens Rim & Glowing Bezel -->
    <ellipse cx="44" cy="36" rx="16" ry="7"
             transform="rotate(45 44 36)"
             fill="url(#lensGlow)" stroke="#fef08a" stroke-width="2"/>

    <!-- Lens Center Hotspot -->
    <ellipse cx="44" cy="36" rx="7" ry="3.5"
             transform="rotate(45 44 36)"
             fill="#ffffff"/>

    <!-- Power Switch on Body -->
    <rect x="60" y="55" width="8" height="12" rx="4"
          transform="rotate(-45 64 81)"
          fill="url(#switchGrad)" stroke="#bae6fd" stroke-width="1"/>
    <circle cx="64" cy="61" r="2"
            transform="rotate(-45 64 81)"
            fill="#ffffff"/>
  </g>

  <!-- Glowing Sparkles -->
  <circle cx="16" cy="16" r="3" fill="#fef08a" opacity="0.9"/>
  <circle cx="28" cy="12" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="12" cy="28" r="1.5" fill="#facc15" opacity="0.8"/>
</svg>
