[options]
HoldPkg     = pacman glibc
Architecture = aarch64
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
DisableSandbox

# Keep downloads on disk across runs: a stalled mirror then resumes instead of
# re-fetching the whole 1.2 GB package set (this lives on the /build volume).
CacheDir = /build/.cache/pacman/

# mirror.archlinuxarm.org drops connections mid-transfer ("Operation too slow.
# Less than 1 bytes/sec"), which aborts the whole pacstrap transaction; the
# default 10 s low-speed timeout is too eager for a 1.2 GB bootstrap.
DisableDownloadTimeout
ParallelDownloads = 5

[core]
Server = https://ca.us.mirror.archlinuxarm.org/$arch/$repo
Server = http://mirror.archlinuxarm.org/$arch/$repo

[extra]
Server = https://ca.us.mirror.archlinuxarm.org/$arch/$repo
Server = http://mirror.archlinuxarm.org/$arch/$repo

[alarm]
Server = https://ca.us.mirror.archlinuxarm.org/$arch/$repo
Server = http://mirror.archlinuxarm.org/$arch/$repo
