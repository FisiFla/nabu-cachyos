# Tablet power-button behaviour.
#
# Default systemd-logind sets HandlePowerKey=poweroff (treats every short
# press as "shut down now"), which is surprising on a touch tablet that
# has no other obvious way to suspend. iPads / Android tablets all map
# short press to suspend; do the same here.
#
# Long-press still powers off so we don't lose the "hold ~15s to force
# shutdown" recovery path documented for NAS-230.
[Login]
HandlePowerKey=suspend
HandlePowerKeyLongPress=poweroff

# nabu has no lid switch — these handlers fire on phantom HALL_SENSOR
# events at boot on some kernels. Ignore them so the device never
# accidentally suspends from a non-existent lid.
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
